alerts:
  - name: HighRequestLatency
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    destination: '#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    destination: '#llmops-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: QualityScoreDegraded
    severity: warning
    condition: 'mean(response_sent.quality_score) < 0.75'
    duration: 15m
    type: symptom-based
    channel: slack
    destination: '#llmops-alerts'
    owner: llm-oncall
    runbook: docs/alerts.md#alert-3
